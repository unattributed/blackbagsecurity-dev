name: deploy development preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-development-preview
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: unattributed/blackbagsecurity.github.io
  DEVELOPMENT_URL: https://dev.blackbagsecurity.com

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Read website source ref
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ref="$(tr -d '\r\n' < preview/source-ref.txt)"
          if [[ -z "$ref" ]]; then
            echo "preview/source-ref.txt is empty" >&2
            exit 1
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
          printf 'Using source ref: %s\n' "$ref"

      - name: Checkout authoritative website source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ steps.source.outputs.ref }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Record source commit
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C source rev-parse HEAD)"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'Source commit: %s\n' "$sha"

      - name: Prepare development Jekyll configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f source/docs/_config.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('source/docs/_config.yml')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          replaced = False
          for i, line in enumerate(lines):
              if line.startswith('url:'):
                  lines[i] = 'url: "https://dev.blackbagsecurity.com"'
                  replaced = True
                  break
          if not replaced:
              lines.append('url: "https://dev.blackbagsecurity.com"')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./source/docs
          destination: ./_site
          verbose: true

      - name: Reclaim generated artifact ownership
        shell: bash
        run: |
          set -euo pipefail
          test -d _site
          sudo chown -R "$(id -u):$(id -g)" _site
          chmod -R u+rwX _site

      - name: Harden development preview artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -f _site/CNAME

          python3 - <<'PY'
          from pathlib import Path
          import re

          marker = '<meta name="robots" content="noindex, nofollow, noarchive">'
          pattern = re.compile(r'<meta\s+name=["\']robots["\']\s+content=["\'][^"\']*["\']\s*/?>', re.I)
          root = Path('_site')
          html_files = list(root.rglob('*.html'))
          if not html_files:
              raise SystemExit('no HTML files were produced by the Jekyll build')

          for path in html_files:
              text = path.read_text(encoding='utf-8')
              if pattern.search(text):
                  text = pattern.sub(marker, text, count=1)
              else:
                  if '<head>' not in text:
                      raise SystemExit(f'missing <head> in {path}')
                  text = text.replace('<head>', '<head>\n  ' + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

          cat > _site/robots.txt <<'EOF'
          User-agent: *
          Disallow: /
          EOF

          cat > _site/preview-build.txt <<EOF
          environment=development
          source_repository=${SOURCE_REPOSITORY}
          source_ref=${{ steps.source.outputs.ref }}
          source_commit=${{ steps.revision.outputs.sha }}
          preview_url=${DEVELOPMENT_URL}
          EOF

      - name: Validate development artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test ! -e _site/CNAME
          grep -q 'name="robots" content="noindex, nofollow, noarchive"' _site/index.html
          grep -q '^Disallow: /$' _site/robots.txt

          if [[ -f _site/sitemap.xml ]]; then
            if ! grep -q 'https://dev.blackbagsecurity.com' _site/sitemap.xml; then
              echo "sitemap.xml does not contain the development hostname" >&2
              exit 1
            fi
          fi

          if grep -RIl --exclude='preview-build.txt' 'www.blackbagsecurity.com' _site >/tmp/production-domain-files.txt; then
            echo "Note: production-domain references remain in generated content:" >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/- `/' /tmp/production-domain-files.txt | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo '## Development preview build'
            echo
            echo "- source repository: \`${SOURCE_REPOSITORY}\`"
            echo "- source ref: \`${{ steps.source.outputs.ref }}\`"
            echo "- source commit: \`${{ steps.revision.outputs.sha }}\`"
            echo "- target: \`${DEVELOPMENT_URL}\`"
            echo '- crawler directive: `noindex, nofollow, noarchive`'
            echo '- robots policy: `Disallow: /`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy development preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
